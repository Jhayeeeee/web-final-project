<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost & Found - My Claims</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-100 min-h-screen font-sans">

    <!-- NAVBAR -->
    <nav class="bg-neutral-900 text-white p-4 shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-6">
                <h1 class="text-xl font-bold tracking-wider text-white">Lost & Found Portal</h1>
                <div class="hidden md:flex space-x-4">
                    <a href="feed.html" class="text-neutral-400 hover:text-white transition pb-1">Feed</a>
                    <a href="my-claims.html" class="text-white border-b-2 border-white pb-1 font-semibold">My Claims</a>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <div class="text-right hidden sm:block">
                    <p class="text-sm font-semibold" id="navUserName">Student User</p>
                    <p class="text-xs text-neutral-400">University Account</p>
                </div>
                <div class="h-8 w-8 rounded-full bg-neutral-700 flex items-center justify-center font-bold text-sm">
                    U
                </div>
                <button id="logoutBtn" class="text-sm text-neutral-400 hover:text-white transition ml-2">Logout</button>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
        <div class="mb-6 border-b border-neutral-300 pb-4">
            <h2 class="text-2xl font-bold text-neutral-800">My Reports & Claims</h2>
            <p class="text-sm text-neutral-500 mt-1">View and manage your reported items here.</p>
        </div>

        <!-- ITEMS GRID -->
        <div id="myItemsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Dito papasok ang items ng user galing sa JavaScript -->
        </div>
    </main>

    <script src="my-claims.js"></script>
</body>
</html>
