<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost & Found Portal - Register</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-500 h-screen flex items-center justify-center">

    <!-- Registration Box (Same Frosted Glass Style) -->
    <div class="w-full max-w-md p-8 bg-white/20 backdrop-blur-md border-white/30 rounded-2xl shadow-2xl">
        
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-gray-900">Create an Account</h2>
            <p class="text-gray-800 mt-2 text-sm">Register using your official university email</p>
        </div>

        <form id="registerForm" class="space-y-4">
            <!-- Full Name Input -->
            <div>
                <label for="fullName" class="block text-sm font-semibold text-gray-900">Full Name</label>
                <input type="text" id="fullName" name="fullName" required placeholder="Juan Dela Cruz"
                    class="mt-1 block w-full px-4 py-3 bg-white/70 border border-gray-300 rounded-lg text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white placeholder-gray-500 transition duration-200">
            </div>

            <!-- University Email Input -->
            <div>
                <label for="email" class="block text-sm font-semibold text-gray-900">University Email</label>
                <input type="email" id="email" name="email" required placeholder="name@university.edu.ph"
                    class="mt-1 block w-full px-4 py-3 bg-white/70 border border-gray-300 rounded-lg text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white placeholder-gray-500 transition duration-200">
            </div>

            <!-- Password Input -->
            <div>
                <label for="password" class="block text-sm font-semibold text-gray-900">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••"
                    class="mt-1 block w-full px-4 py-3 bg-white/70 border border-gray-300 rounded-lg text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white placeholder-gray-500 transition duration-200">
            </div>

            <!-- Confirm Password Input -->
            <div>
                <label for="confirmPassword" class="block text-sm font-semibold text-gray-900">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="••••••••"
                    class="mt-1 block w-full px-4 py-3 bg-white/70 border border-gray-300 rounded-lg text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white placeholder-gray-500 transition duration-200">
            </div>

            <!-- Register Button -->
            <button type="submit" 
                class="w-full mt-6 py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg shadow-md transition duration-200">
                Register
            </button>
        </form>

        <!-- Back to Login Link -->
        <div class="mt-4 text-center">
            <p class="text-sm text-gray-800 font-medium">Already have an account? 
                <a href="index.html" class="text-blue-700 font-bold hover:underline">Log in here</a>
            </p>
        </div>

        <p id="errorMessage" class="text-[#FF0000] text-large font-bold text-center rounded py-2 mb-4 hidden"></p>

    </div>
            <script src="auth.js"></script>
</body>
</html>
