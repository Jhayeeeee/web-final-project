<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost & Found - My Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-100 min-h-screen font-sans">

    <!-- NAVBAR -->
    <nav class="bg-[#1a1a1a] text-white px-4 sm:px-6 py-3 shadow-md sticky top-0 z-40">
        <div class="flex items-center justify-between gap-3">

            <!-- Kaliwa: pamagat at desktop tabs -->
            <div class="flex items-center gap-4 sm:gap-6 min-w-0">
                <h1 class="text-base sm:text-lg font-bold tracking-wide whitespace-nowrap">Lost & Found Portal</h1>
                <div class="hidden md:flex items-center bg-neutral-800 rounded-lg p-1 gap-1">
                    <a href="feed.html" class="whitespace-nowrap px-4 py-1.5 rounded-md text-gray-400 hover:text-white hover:bg-neutral-700 text-sm font-medium transition">Feed</a>
                    <a href="my-claims.html" class="whitespace-nowrap px-4 py-1.5 rounded-md text-gray-400 hover:text-white hover:bg-neutral-700 text-sm font-medium transition">My Claims</a>
                </div>
            </div>

            <!-- Kanan: settings (aktibo), pangalan, avatar, logout, at hamburger -->
            <div class="flex items-center gap-2 sm:gap-4 shrink-0">
                <a href="profile.html" class="hidden md:block text-white p-1" title="Account Settings">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                </a>

                <div class="hidden lg:block text-right leading-tight">
                    <p id="navUserName" class="text-sm font-semibold max-w-[140px] truncate">Student User</p>
                    <p class="text-[10px] text-neutral-400">University Account</p>
                </div>

                <span class="user-initial-circle rounded-full bg-neutral-700 text-white w-8 h-8 flex items-center justify-center text-xs font-bold uppercase shrink-0">U</span>

                <button id="logoutBtn" class="hidden md:block border border-neutral-600 px-4 py-1.5 rounded hover:bg-neutral-800 text-sm transition">Logout</button>

                <button id="mobileMenuBtn" class="md:hidden text-neutral-300 hover:text-white p-1" aria-label="Menu">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Mobile menu -->
        <div id="mobileNavMenu" class="hidden md:hidden mt-3 pt-3 border-t border-neutral-700 space-y-1">
            <div class="flex items-center gap-3 px-2 py-2">
                <span class="user-initial-circle rounded-full bg-neutral-700 text-white w-8 h-8 flex items-center justify-center text-xs font-bold uppercase shrink-0">U</span>
                <div>
                    <p id="mobileNavUserName" class="text-sm font-semibold">Student User</p>
                    <p class="text-[10px] text-neutral-400">University Account</p>
                </div>
            </div>
            <a href="feed.html" class="block px-2 py-2 rounded-md text-neutral-300 hover:bg-neutral-800">Feed</a>
            <a href="my-claims.html" class="block px-2 py-2 rounded-md text-neutral-300 hover:bg-neutral-800">My Claims</a>
            <a href="profile.html" class="block px-2 py-2 rounded-md bg-neutral-800 font-semibold">Account Settings</a>
            <button id="logoutBtnMobile" class="block w-full text-left px-2 py-2 rounded-md text-red-400 hover:bg-neutral-800">Logout</button>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="max-w-3xl mx-auto p-4 sm:p-6 lg:p-8 mt-2 sm:mt-4">
        <div class="mb-6 border-b border-neutral-300 pb-4">
            <h2 class="text-xl sm:text-2xl font-bold text-neutral-800">Account Settings</h2>
            <p class="text-sm text-neutral-500 mt-1">Manage your profile and security.</p>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-neutral-200 overflow-hidden">
            <!-- Profile Information -->
            <div class="p-6 border-b border-neutral-200 bg-neutral-50">
                <h3 class="text-lg font-bold text-neutral-900 mb-4">Profile Information</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-neutral-500 uppercase tracking-wide mb-1">Full Name</label>
                        <p id="profileName" class="text-neutral-800 font-medium py-2 px-3 bg-neutral-200 rounded-md">Loading...</p>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-neutral-500 uppercase tracking-wide mb-1">Email Address</label>
                        <p id="profileEmail" class="text-neutral-800 font-medium py-2 px-3 bg-neutral-200 rounded-md break-all">Loading...</p>
                    </div>
                </div>
            </div>

            <!-- Change Password -->
            <div class="p-6">
                <h3 class="text-lg font-bold text-neutral-900 mb-4">Change Password</h3>
                <form id="changePasswordForm" class="space-y-4 max-w-md">
                    <div>
                        <label class="block text-sm font-semibold text-neutral-700 mb-1">Current Password</label>
                        <input type="password" id="currentPassword" required class="w-full px-4 py-2 border border-neutral-300 rounded-lg focus:ring-2 focus:ring-neutral-800 focus:border-neutral-800 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-neutral-700 mb-1">New Password</label>
                        <input type="password" id="newPassword" required minlength="6" class="w-full px-4 py-2 border border-neutral-300 rounded-lg focus:ring-2 focus:ring-neutral-800 focus:border-neutral-800 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-neutral-700 mb-1">Confirm New Password</label>
                        <input type="password" id="confirmPassword" required minlength="6" class="w-full px-4 py-2 border border-neutral-300 rounded-lg focus:ring-2 focus:ring-neutral-800 focus:border-neutral-800 outline-none transition">
                    </div>
                    <div id="passwordMessage" class="text-sm hidden font-medium"></div>
                    <button type="submit" id="updatePasswordBtn" class="w-full py-2.5 bg-neutral-900 hover:bg-black text-white font-bold rounded-lg transition shadow-sm mt-2">
                        Update Password
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="profile.js"></script>
    <script src="toggle-password.js"></script>

    <!-- Admin: palitan ang Feed ng Admin Panel, at alisin ang My Claims -->
    <script>
        (function () {
            const u = JSON.parse(localStorage.getItem('user') || 'null');
            if (!u || u.role !== 'admin') return;

            document.querySelectorAll('a[href="feed.html"]').forEach(a => {
                a.href = 'admin.html';
                a.textContent = 'Admin Panel';
            });
            document.querySelectorAll('a[href="my-claims.html"]').forEach(a => a.remove());
        })();
    </script>
</body>
</html>
