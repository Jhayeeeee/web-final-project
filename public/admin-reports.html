<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moderation - Reported Posts</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-100 min-h-screen font-sans">

    <nav class="bg-[#1a1a1a] text-white px-4 sm:px-6 py-3 shadow-md relative z-40">
            <div class="flex items-center justify-between gap-3">

        <!-- Kaliwa: pamagat at desktop tabs -->
        <div class="flex items-center gap-4 sm:gap-6 min-w-0">
            <h1 class="hidden md:block text-lg font-bold tracking-wide">Admin Panel</h1>
            <div class="hidden md:flex items-center bg-neutral-800 rounded-lg p-1 gap-1">
                <a href="admin.html" class="whitespace-nowrap px-4 py-1.5 rounded-md bg-neutral-600 text-white text-sm font-bold shadow transition">Inventory</a>
                <a href="admin-reports.html" class="whitespace-nowrap px-4 py-1.5 rounded-md text-gray-400 hover:text-white hover:bg-neutral-700 text-sm font-medium transition">Post Management</a>
                <a href="admin-notify.html" class="whitespace-nowrap px-4 py-1.5 rounded-md text-gray-400 hover:text-white hover:bg-neutral-700 text-sm font-medium transition">Notifications</a>
                <a href="admin-banned.html" class="whitespace-nowrap px-4 py-1.5 rounded-md text-gray-400 hover:text-white hover:bg-neutral-700 text-sm font-medium transition">Banned Accounts</a>
            </div>
        </div>

        <!-- Kanan: avatar, pangalan, logout, at hamburger -->
        <div class="flex items-center gap-2 sm:gap-4 shrink-0">
            <span id="adminInitials" class="bg-neutral-600 text-white w-8 h-8 flex items-center justify-center rounded-full text-xs font-bold uppercase shrink-0">AD</span>
            <span id="adminNameDisplay" class="hidden lg:inline text-sm max-w-[140px] truncate">Admin Account</span>

            <button id="logoutBtn" class="hidden md:block border border-neutral-600 px-4 py-1.5 rounded hover:bg-neutral-800 text-sm transition">Logout</button>

            <button id="adminMenuBtn" class="md:hidden text-neutral-300 hover:text-white p-1" aria-label="Menu">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- Mobile menu: lumalabas kapag pinindot ang hamburger -->
    <div id="adminMobileMenu" class="hidden md:hidden mt-3 pt-3 border-t border-neutral-700 space-y-1">
        <div class="flex items-center gap-3 px-2 py-2">
            <span id="adminInitialsMobile" class="bg-neutral-600 text-white w-8 h-8 flex items-center justify-center rounded-full text-xs font-bold uppercase shrink-0">AD</span>
            <p id="adminNameMobile" class="text-sm font-semibold truncate">Admin Account</p>
        </div>
        <a href="admin.html" class="block px-2 py-2 rounded-md bg-neutral-800 font-semibold">Inventory</a>
        <a href="admin-reports.html" class="block px-2 py-2 rounded-md text-neutral-300 hover:bg-neutral-800">Post Management</a>
        <a href="admin-notify.html" class="block px-2 py-2 rounded-md text-neutral-300 hover:bg-neutral-800">Notifications</a>
        <a href="admin-banned.html" class="block px-2 py-2 rounded-md text-neutral-300 hover:bg-neutral-800">Banned Accounts</a>
        <button id="logoutBtnMobile" class="block w-full text-left px-2 py-2 rounded-md text-red-400 hover:bg-neutral-800">Logout</button>
    </div>
</nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-5 sm:py-8">
        <div class="mb-5 sm:mb-6">
            <h2 class="text-xl sm:text-3xl font-extrabold text-red-600">Reported Posts</h2>
            <p class="text-gray-500 text-xs sm:text-sm mt-1">Review items flagged by students as spam or inappropriate.</p>
        </div>

        <!-- Cards grid: 1 column sa phone -->
        <div id="reportsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6 pb-12">
            <p class="text-neutral-500 col-span-full"></p>
        </div>
    </main>

    <!-- View Details Modal -->
    <div id="detailsModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 p-4">
        <div class="bg-white rounded-xl p-5 sm:p-6 max-w-lg w-full mx-auto shadow-xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h3 class="text-lg font-bold text-gray-900">Item Full Details</h3>
                <button onclick="closeDetailsModal()" class="text-gray-400 hover:text-gray-600 font-bold text-lg">&times;</button>
            </div>
            <div id="detailsModalContent" class="space-y-3 text-sm text-gray-700 break-words"></div>
            <div class="mt-6 flex justify-end">
                <button onclick="closeDetailsModal()" class="px-4 py-2 bg-neutral-800 text-white text-sm font-bold rounded-lg hover:bg-black transition">Close</button>
            </div>
        </div>
    </div>

    <!-- Universal Toast Modal -->
    <div id="toastModal" class="hidden fixed inset-0 bg-black/50 z-[70] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full mx-auto shadow-2xl text-center">
            <div id="toastIcon" class="flex justify-center mb-4"></div>
            <h3 id="toastTitle" class="text-base font-bold text-neutral-900 mb-1"></h3>
            <p id="toastMessage" class="text-sm text-neutral-500 mb-5"></p>
            <button id="toastOkBtn" class="w-full py-2 bg-neutral-900 text-white text-sm font-bold rounded-lg hover:bg-black transition">OK</button>
        </div>
    </div>

    <!-- Confirm Action Modal -->
    <div id="confirmModal" class="hidden fixed inset-0 bg-black/50 z-[70] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full mx-auto shadow-2xl text-center">
            <div id="confirmIcon" class="flex justify-center mb-4"></div>
            <h3 id="confirmTitle" class="text-base font-bold text-neutral-900 mb-1"></h3>
            <p id="confirmMessage" class="text-sm text-neutral-500 mb-5"></p>
            <div class="flex gap-3">
                <button id="confirmCancelBtn" class="flex-1 py-2 border border-neutral-300 text-neutral-700 text-sm font-semibold rounded-lg hover:bg-neutral-100 transition">Cancel</button>
                <button id="confirmOkBtn" class="flex-1 py-2 bg-red-600 text-white text-sm font-bold rounded-lg hover:bg-red-700 transition">Confirm</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="admin-report.js"></script>
    <script src="admin-nav.js"></script>
</body>
</html>
