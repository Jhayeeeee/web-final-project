<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Systems Final Project</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-xl text-center max-w-md w-full">
        <h1 class="text-2xl font-bold text-slate-800 mb-2">My Task Manager</h1>
        <p class="text-slate-500 mb-6">Node.js + Tailwind Setup</p>
        
        <button onclick="testBackend()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition shadow-md">
            Test Backend Connection
        </button>
        
        <p id="output" class="mt-4 text-sm font-semibold text-slate-600"></p>
    </div>

    <script>
        async function testBackend() {
            try {
                // This talks to the Express route in server.js
                const response = await fetch('/api/test');
                const data = await response.json();
                
                document.getElementById('output').innerText = data.message;
                document.getElementById('ou tput').className = "mt-4 text-sm font-semibold text-green-600";
            } catch (error) {
                document.getElementById('output').innerText = "Error connecting to server.";
                document.getElementById('output').className = "mt-4 text-sm font-semibold text-red-600";
            }
        }
    </script>
</body>
</html>
